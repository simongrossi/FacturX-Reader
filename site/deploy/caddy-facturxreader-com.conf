# ---------------------------------------------------------------------------
# Factur-X Reader
# ---------------------------------------------------------------------------
# facturxreader.com sert le site. Les anciennes adresses (avec un « e »,
# et l'ancien sous-domaine) redirigent en 301 vers l'adresse canonique.

facturxreader.com {
	import hsts
	encode zstd gzip

	root * /var/www/facturexreader

	try_files {path} {path}.html {path}/index.html
	file_server

	@assets path /assets/*
	header @assets Cache-Control "public, max-age=86400"

	header {
		X-Content-Type-Options nosniff
		Referrer-Policy strict-origin-when-cross-origin
		Permissions-Policy "geolocation=(), microphone=(), camera=()"
	}

	handle_errors {
		@notfound expression {err.status_code} == 404
		handle @notfound {
			rewrite * /404.html
			file_server
		}
	}
}

# « facturexreader.com » : variante avec le « e » de « facture ».
facturexreader.com {
	redir https://facturxreader.com{uri} permanent
}

www.facturexreader.com {
	redir https://facturxreader.com{uri} permanent
}

# Ancien sous-domaine, première mise en ligne du site.
facturexreader.simongrossi.com {
	redir https://facturxreader.com{uri} permanent
}
