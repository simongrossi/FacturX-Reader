# Nginx — facturexreader.com
#
# 1. Copier le contenu de site/ dans /var/www/facturexreader
# 2. Copier ce fichier dans /etc/nginx/sites-available/facturexreader
# 3. ln -s /etc/nginx/sites-available/facturexreader /etc/nginx/sites-enabled/
# 4. nginx -t && systemctl reload nginx
# 5. certbot --nginx -d facturexreader.com

server {
    listen 80;
    listen [::]:80;
    server_name facturexreader.com;

    root /var/www/facturexreader;
    index index.html;

    charset utf-8;

    # Pages propres : /mentions-legales sert mentions-legales.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Cache long pour les ressources versionnées par leur contenu.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Le HTML se revalide à chaque visite.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, must-revalidate";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/javascript application/json
               application/xml image/svg+xml;

    # En-têtes de sécurité.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # HSTS : à activer une fois le HTTPS vérifié.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/facturexreader.access.log;
    error_log  /var/log/nginx/facturexreader.error.log;
}
