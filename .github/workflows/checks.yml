name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  reference:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/reference/requirements.txt
      - run: python3 -m pip install -r tests/reference/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/cache@v4
        with:
          path: |
            tests/reference/cache/examples
            tests/reference/cache/france
            tests/reference/cache/factur-x
            tests/reference/cache/en16931
            tests/reference/cache/skeleton
          key: reference-sources-${{ hashFiles('tests/reference/sources.json') }}
      - run: python3 -m unittest discover -s tests/reference -p 'test_*.py'
      - run: python3 tests/reference/compare.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reference-validation
          path: |
            tests/reference/output/summary.json
            tests/reference/output/results.json
            tests/reference/output/manifest.json
            tests/reference/output/corpus

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run check:js
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
  rust:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      # Sur cette machine, WebView2 ignore les arguments ajoutés de l'extérieur (variable
      # d'environnement, registre) : le port de débogage dont le test a besoin est donc inscrit
      # dans la configuration de la fenêtre, pour cette compilation de test seulement. Les
      # installeurs publiés viennent du workflow Release, qui ne le fait pas.
      - name: Build native Windows application
        run: cargo build --manifest-path src-tauri/Cargo.toml
        env:
          TAURI_CONFIG: '{"app":{"windows":[{"label":"main","title":"Factur-X Reader","width":1440,"height":960,"minWidth":800,"minHeight":500,"resizable":true,"dragDropEnabled":false,"additionalBrowserArgs":"--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9333"}]}}'
      - name: WebView2 runtime
        shell: pwsh
        run: |
          $keys = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
                  'HKCU:\SOFTWARE\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $found = $keys | Where-Object { Test-Path $_ } | ForEach-Object { (Get-ItemProperty $_).pv }
          if ($found) { "WebView2 $($found -join ', ')" } else { 'WebView2 runtime absent' }
      - name: Test real Rust commands and WebView2
        run: npm run test:native
        env:
          FACTURX_LAUNCH_SECONDS: 60
          FACTURX_DEBUG_PORT: 9333
