[package]
name = "facturx-reader"
version = "0.7.0"
description = "Visualiseur local de factures electroniques (Factur-X, UBL, CII)"
authors = ["Christophe Mehault", "Simon Grossi"]
license = "PolyForm-Noncommercial-1.0.0"
edition = "2021"

[lib]
name = "facturx_reader_lib"
# Application de bureau uniquement : les formes `staticlib` et `cdylib`, utiles aux cibles
# mobiles de Tauri, faisaient lier trois fois tout le programme à chaque compilation.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
roxmltree = "0.20"
regex = "1.11"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
lopdf = "0.45.0"
xee-xpath = "0.1.5"
uppsala = "0.10"
include_dir = "0.7"

# Développement : pas d'informations de débogage pour les dépendances (le dossier `target`
# dépassait 20 Go et l'édition de liens prenait deux minutes), mais un peu d'optimisation,
# sans quoi la validation Schematron est inutilisable en mode développement.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true
codegen-units = 1
